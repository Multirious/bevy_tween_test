name: Make Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the new release, e.g. "v0.1.0"'
        required: true
        type: string

jobs:
  make-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          target/
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.toml') }}

    - uses: dtolnay/rust-toolchain@stable

    - name: Update CHANGELOG.md version
      run: |
        release_date=$(date --utc +%Y-%m-%d)
        version=${{ inputs.version }}
        sed -zi \
          "s/# Changelog\n\n## Unreleased - XXXX-XX-XX/# Changelog\n\n## Unreleased - XXXX-XX-XX\n\n## $version - $release_date/" \
          CHANGELOG.md

    - name: Update Cargo.toml version
      run: |
        # Should change the top-most version key, which should be ours.
        sed -i 's/version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml

    - name: Update Cargo
      run: |
        cargo update
        cargo check

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: release-${{ inputs.version }}
        commit-message: |
          Release ${{ inputs.version }}

          Update version in CHANGELOG.md
          Update version in Cargo.toml
          Update Cargo.lock
        title: Release ${{ inputs.version }}
        body: |
          Make release for ${{ inputs.version }} by workflow
